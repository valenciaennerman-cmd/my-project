<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FC 27 Favoriler</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .tab-btn { background: transparent; border: none; font-size: 16px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; padding-bottom: 4px; }
    .tab-btn.active { color: var(--text-main); border-bottom-color: var(--gold); font-weight: 600; }
    .fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .fav-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .fav-header { display: flex; justify-content: space-between; align-items: center; }
    .fav-name { font-size: 18px; font-weight: bold; }
    .fav-rating { color: var(--gold); font-weight: bold; }
    .fav-price-box { background: var(--surface-1); padding: 15px; border-radius: 8px; text-align: center; }
    .fav-current-price { font-size: 24px; font-weight: bold; color: var(--gold); }
    .fav-old-price { font-size: 12px; color: var(--muted); text-decoration: line-through; }
    .fav-advice { padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 18px; color: #fff; }
    .fav-change { font-size: 14px; font-weight: bold; margin-top: 5px; }
    .change-up { color: #dc3545; }
    .change-down { color: #28a745; }
    .remove-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <header class="topbar" role="banner">
    <div class="brand">
      <div class="brand-text">
        <h1>FC&nbsp;27 <em>Araçları</em></h1>
      </div>
    </div>
    <div class="tabs" style="display:flex; gap: 20px; align-items:center; margin-left: 30px;">
      <a href="/" class="btn tab-btn " style="text-decoration:none;">Fiyat Aracı</a>
      <a href="/squad" class="btn tab-btn " style="text-decoration:none;">Kadro Oluşturucu</a>
      <a href="/tcp" class="btn tab-btn " style="text-decoration:none;">Trade</a>
      <a href="/favorites" class="btn tab-btn active" style="text-decoration:none;">Favoriler</a>
      <a href="/calculator" class="btn tab-btn " style="text-decoration:none;">Hesaplayıcı</a>
    </div>
  </header>

  <main class="dashboard">
    <div style="max-width: 1200px; margin: 20px auto; padding: 0 20px;">
        <h2>Favori Oyuncularınız & Piyasa Analizi</h2>
        <p style="color:var(--muted); font-size:14px;">Telegram'dan (veya Fiyat Aracı'ndan) favorilere eklediğiniz oyuncuların anlık fiyat değişimleri ve yapay zeka al-sat tavsiyeleri burada gösterilir.</p>
    </div>
    <div class="fav-grid" id="fav-container">
        <!-- JS will populate -->
        <p style="color:var(--muted); text-align:center; grid-column: 1 / -1; margin-top: 40px;">Yükleniyor...</p>
    </div>
  </main>

  <script src="/static/favorites.js"></script>
</body>
</html>
